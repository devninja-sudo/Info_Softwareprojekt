name: Download Dependencies and Build EXE

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # -------------------------
    # VERSION BERECHNEN
    # -------------------------
    - name: Get latest tag
      id: get_tag
      shell: bash
      run: |
        git fetch --force --tags origin
        TAG=$(git tag --list "v*" --sort=-v:refname | head -n 1)
        if [ -z "$TAG" ]; then
          TAG="v0.00.000"
        fi
        echo "latest=$TAG" >> $GITHUB_OUTPUT

    - name: Calculate next version
      id: version
      shell: bash
      run: |
        VERSION=${{ steps.get_tag.outputs.latest }}
        VERSION=${VERSION#v}

        IFS='.' read -r X YY ZZZ <<< "$VERSION"

        MESSAGE="${{ github.event.head_commit.message }}"

        if [[ "$MESSAGE" == *"[major]"* ]]; then
          X=$((X+1))
          YY=0
          ZZZ=0
        elif [[ "$MESSAGE" == *"[minor]"* ]]; then
          YY=$((YY+1))
          ZZZ=0
        else
          ZZZ=$((ZZZ+10))
        fi

        NEW_VERSION="$X.$YY.$ZZZ"
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

    # -------------------------
    # BUILD
    # -------------------------
    - name: Build EXE
      shell: bash
      run: |
        EXE_NAME="Schach_v${{ steps.version.outputs.new_version }}"
        python -m PyInstaller --onefile --windowed --add-data "assets;assets" --name "$EXE_NAME" Brett.py

    # -------------------------
    # TAG ERSTELLEN
    # -------------------------
    - name: Create Tag
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag v${{ steps.version.outputs.new_version }}
        git push origin v${{ steps.version.outputs.new_version }}

    # -------------------------
    # RELEASE
    # -------------------------
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.new_version }}
        name: Schachspiel v${{ steps.version.outputs.new_version }}
        files: dist/Schach_v${{ steps.version.outputs.new_version }}.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
